 <div class="t3"><span class="chipm">${esc(r.kind)}</span><span class="chipm">${esc(r.cat)}</span>${r.pre?'<span class="chipm k">전처리</span>':''}${s==='1'||s==='2'?`<span class="chipm">${s}번 채택</span>`:''}</div></div></div>`}
function tabsFor(r){const T=[['copy','문안 비교'],['ref','레퍼런스'],['cmp','구성 편집']];if(r.pre)T.push(['pre','전처리']);return T}
function detail(r){if(!r)return '<div class="empty">왼쪽 목록에서 레퍼를 고르세요</div>';const s=st[r.id]||'';
 const T=tabsFor(r);if(!T.some(x=>x[0]===TAB))TAB='copy';
 const bar=`<div class="dbar"><button class="tbtn nav" data-nav="-1" title="이전 (↑)">‹</button><button class="tbtn nav" data-nav="1" title="다음 (↓)">›</button>
  <span class="pos">${(()=>{const L=curList();return `${L.findIndex(x=>x.id===r.id)+1} / ${L.length}`})()}</span><div class="seg" id="tabs">${T.map(([k,n])=>`<button data-tab="${k}" class="${TAB===k?'on':''}">${n}</button>`).join('')}</div>
  ${TAB==='copy'?`<div class="seg" id="vmode">${[['both','나란히'],['1','1번'],['2','2번']].map(([k,n])=>`<button data-v="${k}" class="${F.v===k?'on':''}">${n}</button>`).join('')}</div>`:''}
  <div class="sp"></div>
  <button class="tbtn ${s==='1'?'on':''}" data-id="${r.id}" data-s="1">1번 채택</button><button class="tbtn ${s==='2'?'on':''}" data-id="${r.id}" data-s="2">2번 채택</button><div class="tlseg">${['go','hold','no'].map(k=>`<button data-tl="${k}" data-id="${r.id}" class="${TL[r.id]===k?'on '+k:''}"><i class="lt ${k}"></i>${TLN[k]}</button>`).join('')}</div></div>`;
 const head=`<div class="dh">${r.img?`<img class="art zoom" data-rid="${r.id}" src="${r.img}" alt="">`:'<div class="art"></div>'}<div style="min-width:0">
  <div class="srcbar">${srcLine(r,0)}</div><div class="k">${esc(r.prod)} · ${esc(r.cat)} · ${esc(r.fmt)}</div><h2>${esc(r.who.replace(/ 페이지는.*$/,''))}</h2><p class="hk">「${hl(r.hook)}」</p>
  <div class="meta">${esc(r.days)} 게재 · ${esc(r.var)} · 시작 ${esc(r.start)} · 키워드 ${esc(r.kw)} · <a href="https://www.facebook.com/ads/library/?id=${r.id}" target="_blank">광고 라이브러리에서 보기</a></div>
  <div class="tags">${r.pre?'<span class="tag conf">확정 · 전처리</span>':''}${r.rec?'<span class="tag rec">추천</span>':''}${r.judge?'<span class="tag judge">판단 필요</span>':''}${(CM[r.id]||[]).length?`<span class="tag">내 구성 ${(CM[r.id]||[]).length}줄</span>`:''}</div></div></div>`;
 let body='';const none='<div class="kbd">워싱 문안 미작성 · 11/02 회차 수집분</div>';
 if(TAB==='copy')body=`<div class="two ${F.v==='both'?'':'one'}">${F.v!=='2'?`<div class="vcard"><h4>1번 · 레퍼 소구 따라가기</h4>${r.v1.length?lines(r.v1):none}</div>`:''}${F.v!=='1'?`<div class="vcard"><h4>2번 · 레퍼 훅·구조 + 하루나 소구</h4>${r.v2.length?lines(r.v2):none}</div>`:''}</div>`;
 else if(TAB==='ref')body=`<div class="grp">${r.struct?`<h4>레퍼 구조</h4><div class="bd0">${hl(r.struct)}</div>`:''}
  ${r.tr?`<details><summary>음성 전사</summary><pre>${hl(r.tr)}</pre></details>`:''}<details ${r.tr?'':'open'}><summary>광고 본문 원문</summary><pre>${hl(r.body)}</pre></details>${r.point?`<details><summary>미러링 포인트</summary><pre>${hl(r.point)}</pre></details>`:''}</div>`;
 else if(TAB==='cmp')body=cmpPanel(r);
 else if(TAB==='pre')body=preBlock(r.pre);
 return bar+`<article id="r${r.n}">`+head+`<div class="sec">${opHtml(r,0)}${body}</div></article>`}
function curList(){const L=R.filter(pass);const k=F.sort||'';const D=r=>parseInt(r.days)||0,V=r=>parseInt((r.var||'').replace(/\D/g,''))||0,E=r=>parseFloat(String(r.eng||'').replace(/[^\d.]/g,''))||-1;
 if(k==='days')L.sort((a,b)=>D(b)-D(a));else if(k==='days_asc')L.sort((a,b)=>D(a)-D(b));else if(k==='start')L.sort((a,b)=>(b.start||'').localeCompare(a.start||''));else if(k==='var')L.sort((a,b)=>V(b)-V(a)||D(b)-D(a));else if(k==='eng')L.sort((a,b)=>E(b)-E(a)||D(b)-D(a));return L}
function render(){const ls=document.getElementById('lsw'),dt=document.getElementById('detail');const a=ls.scrollTop,b=dt.scrollTop;const prevSel=SEL;
 side();tally();const L=curList();if(!L.some(r=>r.id===SEL))SEL=L.length?L[0].id:null;
 const S=SETS.find(x=>x[0]===F.set);document.getElementById('lt').textContent=F.cat||S[1];document.getElementById('ltv').textContent=(F.cat||S[1])+' · '+L.length;document.getElementById('lc').textContent=`${L.length}개의 레퍼`;
 document.getElementById('list').innerHTML=L.length?L.map(rowItem).join(''):'<div class="empty">조건에 맞는 레퍼가 없습니다</div>';
 if(SEL&&SEL===prevSel&&dt.dataset.cur===SEL&&dt.dataset.tab===TAB){dt.innerHTML=detail(R.find(r=>r.id===SEL));dt.scrollTop=b}else{dt.innerHTML=detail(R.find(r=>r.id===SEL));dt.scrollTop=0}
 dt.dataset.cur=SEL||'';dt.dataset.tab=TAB;ls.scrollTop=a}
function selectId(id){SEL=id;OPEN.add(id);render();const el=document.querySelector(`.it[data-sel="${id}"]`);if(el)el.scrollIntoView({block:'nearest'})}
function step(d){const L=curList();const i=L.findIndex(r=>r.id===SEL);const n=L[Math.max(0,Math.min(L.length-1,i+d))];if(n)selectId(n.id)}
document.addEventListener('click',e=>{const t=e.target;const it=t.closest&&t.closest('.it[data-sel]');
 if(it){selectId(it.dataset.sel);return}
 if(t.dataset.tab){TAB=t.dataset.tab;if(TAB==='cmp'&&SEL)OPEN.add(SEL);render();return}
 if(t.dataset.nav){step(+t.dataset.nav);return}});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select,textarea,[contenteditable="true"]'))return;
 if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();step(1)}else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();step(-1)}
 else if(e.key==='1'||e.key==='2'){const id=SEL;if(!id)return;st[id]=st[id]===e.key?'':e.key;if(!st[id])delete st[id];localStorage.setItem(KEY,JSON.stringify(st));render()}
 else if(e.key==='/'){e.preventDefault();q.focus()}});
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.set!==undefined){F.set=t.closest('[data-set]').dataset.set;render()}
  else if(t.closest('[data-cat]')){F.cat=t.closest('[data-cat]').dataset.cat;render()}
  else if(t.closest('[data-set]')){F.set=t.closest('[data-set]').dataset.set;render()}
  else if(t.dataset.s){const id=t.dataset.id;st[id]=st[id]===t.dataset.s?'':t.dataset.s;if(!st[id])delete st[id];localStorage.setItem(KEY,JSON.stringify(st));const y=scrollY;render();scrollTo(0,y)}
  else if(t.dataset.v){F.v=t.dataset.v;document.querySelectorAll('#vmode button').forEach(b=>b.classList.toggle('on',b===t));render()}
  else if(t.dataset.p!==undefined&&t.closest('#prod')){F.prod=t.dataset.p;document.querySelectorAll('#prod button').forEach(b=>b.classList.toggle('on',b===t));render()}
  else if(t.dataset.f!==undefined&&t.closest('#fmt')){F.fmt=t.dataset.f;document.querySelectorAll('#fmt button').forEach(b=>b.classList.toggle('on',b===t));render()}
    else if(t.classList.contains('zoom')){lb.querySelector('img').src=t.src;lb.style.display='flex'}
  else if(t.closest('#lb')){lb.style.display='none'}
});
q.addEventListener('input',e=>{F.q=e.target.value.trim();render()});
exp.onclick=()=>{const rows=[['번호','라이브러리ID','광고주','제품','카테고리','신호등','채택']];R.forEach(r=>{if(st[r.id]||TL[r.id])rows.push([r.n,r.id,r.who,r.prod,r.cat,TLN[TL[r.id]]||'',st[r.id]==='1'||st[r.id]==='2'?st[r.id]+'번':''])});
  navigator.clipboard.writeText(rows.map(x=>x.join('\t')).join('\n')).then(()=>{exp.textContent=`복사 완료 (${rows.length-1}건)`;setTimeout(()=>exp.textContent='검토 결과 TSV 복사',1500)})};
clr.onclick=()=>{if(confirm('검토 표시를 모두 지울까요?')){st={};localStorage.removeItem(KEY);render()}};
cexp.onclick=()=>{const out=R.filter(r=>(CM[r.id]||[]).length).map(r=>`### ${r.n}. ${r.who} — 「${r.hook}」\n${cmpText(r.id)}`).join('\n\n');navigator.clipboard.writeText(out).then(()=>{cexp.textContent='복사 완료';setTimeout(()=>cexp.textContent='내 구성 전체 복사',1500)})};
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.clipt');if(c){const v=c.querySelector('video');if(v.paused)v.play().catch(()=>{})}});
document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.clipt');if(c&&!c.contains(e.relatedTarget)){const v=c.querySelector('video');v.pause();v.currentTime=0}});
document.getElementById('pv').addEventListener('click',e=>{const t=e.target;if(t.dataset.pvm){PVM=t.dataset.pvm;document.querySelectorAll('#pv .pvm').forEach(b=>b.classList.toggle('on',b===t));if(PV&&PV.go)PV.go(Math.min(PV.i,9999));}else if(t.dataset.pvx!==undefined||t.id==='pv')closePV();else if(t.dataset.pvr!==undefined&&PV&&PV.go)PV.go(0);else if(t.dataset.pvi!==undefined&&PV&&PV.go)PV.go(+t.dataset.pvi)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePV()});

const UIK='ui261103';let UI=JSON.parse(localStorage.getItem(UIK)||'{"sb":1,"ls":1,"closed":[]}');
function applyUI(){const app=document.querySelector('.app');app.classList.toggle('nosb',!UI.sb);app.classList.toggle('nols',!UI.ls);
 document.querySelectorAll('.sbsec').forEach(s=>s.classList.toggle('closed',UI.closed.includes(s.dataset.sec)));localStorage.setItem(UIK,JSON.stringify(UI))}
function tlHtml(r){const v=TL[r.id]||'';return `<span class="tlr">${['go','hold','no'].map(k=>`<button class="lt ${k} ${v===k?'on':''}" data-tl="${k}" data-id="${r.id}" title="${TLN[k]}"></button>`).join('')}</span>`}
document.addEventListener('click',e=>{const t=e.target;const b=t.closest&&t.closest('[data-tl]');
 if(b){e.stopImmediatePropagation();e.preventDefault();const id=b.dataset.id,k=b.dataset.tl;if(TL[id]===k)delete TL[id];else TL[id]=k;localStorage.setItem(TLK,JSON.stringify(TL));render();return}
 const c=t.closest&&t.closest('[data-close]');if(c){e.stopImmediatePropagation();UI[c.dataset.close]=0;applyUI();return}
 const o=t.closest&&t.closest('[data-open]');if(o){e.stopImmediatePropagation();UI[o.dataset.open]=1;applyUI();return}
 const h=t.closest&&t.closest('[data-sec-t]');if(h){const k=h.dataset.secT;UI.closed=UI.closed.includes(k)?UI.closed.filter(x=>x!==k):UI.closed.concat(k);applyUI()}},true);
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.metaKey&&(e.key==='s'||e.key==='S')){e.preventDefault();UI.sb=!UI.sb;applyUI()}else if(e.ctrlKey&&e.metaKey&&(e.key==='l'||e.key==='L')){e.preventDefault();UI.ls=!UI.ls;applyUI()}
 else if(!(e.target.closest&&e.target.closest('input,select,textarea,[contenteditable="true"]'))&&SEL&&['g','y','r'].includes(e.key)){const k={g:'go',y:'hold',r:'no'}[e.key];if(TL[SEL]===k)delete TL[SEL];else TL[SEL]=k;localStorage.setItem(TLK,JSON.stringify(TL));render()}});
applyUI();
document.addEventListener('click',e=>{const t=e.target;if(t.classList&&t.classList.contains('zoom')){const r=R.find(x=>x.id===t.dataset.rid);const s=lb.querySelector('.lbs');s.innerHTML=r?lbSide(r):'';s.style.display=r?'block':'none'}
 if(t.closest&&t.closest('.lbs')){e.stopImmediatePropagation();if(!t.closest('a'))e.preventDefault()}},true);
sort.addEventListener('change',e=>{F.sort=e.target.value;render();document.getElementById('lsw').scrollTop=0});
(()=>{const o=sort.querySelector('option[value="eng"]');if(!R.some(r=>r.eng)){o.disabled=true;o.textContent='인게이지먼트 높은 순 · 측정값 없음'}})();
render();
</script>
